server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${cityart.datasource.driver-class-name}
      url: jdbc:mysql://${cityart.datasource.host}:${cityart.datasource.port}/${cityart.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${cityart.datasource.username}
      password: ${cityart.datasource.password}
  redis:
    host: ${cityart.redis.host}
    port: ${cityart.redis.port}
    database: ${cityart.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cityart.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      cityart:
        mapper: debug
        service: info
        controller: info

cityart:
  jwt:
    # 管理端jwt签名加密时使用的秘钥
    admin-secret-key: cityart-admin
    # 管理端jwt过期时间
    admin-ttl: 7200000
    # 管理端前端传递过来的令牌名称
    admin-token-name: token
    # 用户端jwt签名加密时使用的秘钥
    user-secret-key: cityart-user
    # 用户端jwt过期时间
    user-ttl: 7200000
    # 用户端前端传递过来的令牌名称
    user-token-name: authentication
